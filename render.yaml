services:
  - type: web
    name: tank-arena-blitz-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set this to your deployed Vercel frontend origin(s) after you know
      # the domain, e.g. https://tank-arena-blitz.vercel.app
      # (comma-separate multiple origins for staging + production).
      # The server fails closed and refuses to start without this in
      # production — see server/corsConfig.js.
      - key: CLIENT_URL
        sync: false
      # PORT is provided automatically by Render — no need to set it.
